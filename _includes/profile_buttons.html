<div class="profile-buttons">
  <a class="profile-button" href="{{ site.cv_file | relative_url }}" target="_blank"><i class="fas fa-file-alt"></i> CV</a>
  {% if site.scholar_userid %}<a class="profile-button" href="https://scholar.google.com/citations?user={{ site.scholar_userid }}" target="_blank"><i class="ai ai-google-scholar"></i> Google Scholar</a>{% endif %}
  {% if site.linkedin_username %}<a class="profile-button" href="https://www.linkedin.com/in/{{ site.linkedin_username }}" target="_blank"><i class="fab fa-linkedin"></i> LinkedIn</a>{% endif %}
  {% if site.github_username %}<a class="profile-button" href="https://github.com/{{ site.github_username }}" target="_blank"><i class="fab fa-github"></i> GitHub</a>{% endif %}
  {% if site.twitter_username %}<a class="profile-button" href="https://x.com/{{ site.twitter_username }}" target="_blank"><svg class="x-logo" width="12" height="12" viewBox="0 0 512 512" aria-hidden="true"><path fill="currentColor" d="M389.2 48h70.6L305.6 224.2 487 464H345L233.7 318.6 106.5 464H35.8L200.7 275.5 26.8 48H172.4L272.9 180.9 389.2 48zM364.4 421.8h39.1L151.1 88h-42L364.4 421.8z"/></svg> X</a>{% endif %}
</div>
